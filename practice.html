<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anatomy Set Practice</title>
<meta name="description" content="Free practice for Medical Terminology by Brian Khan Quintana, M.D.: every chapter's must-know words in his own voice, matching, build the word, read the chart, and self-checks with the book's answers.">
<meta name="theme-color" content="#1c1e21">
<style>
:root{
  --paper:#faf8f3; --card:#ffffff; --ink:#1c1e21; --soft:#5b6068; --line:#e6e1d6;
  --pre:#6b3fa0; --root:#b0283a; --suf:#0e6b63; --ok:#1f7a4d; --warn:#b5502a; --accent:#0e6b63;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 6px 20px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#15171a; --card:#1e2125; --ink:#eceae4; --soft:#a3a8b0; --line:#2e3238;
    --pre:#b493e0; --root:#ef7d8b; --suf:#5cc6b9; --ok:#5ccf93; --warn:#f09a6e; --accent:#5cc6b9;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --paper:#15171a; --card:#1e2125; --ink:#eceae4; --soft:#a3a8b0; --line:#2e3238;
  --pre:#b493e0; --root:#ef7d8b; --suf:#5cc6b9; --ok:#5ccf93; --warn:#f09a6e; --accent:#5cc6b9;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.5 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.serif{font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Noto Serif",Georgia,serif}
main{max-width:720px;margin:0 auto;padding:16px 16px 96px}
header.top{display:flex;align-items:center;gap:10px;margin:4px 0 18px}
header.top h1{font-size:20px;margin:0;flex:1;letter-spacing:.2px}
.icon-btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 12px;font:inherit;font-size:15px;cursor:pointer}
.icon-btn:focus-visible,.btn:focus-visible,.tile:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.lede{color:var(--soft);margin:-8px 0 18px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;cursor:pointer;box-shadow:var(--shadow);font:inherit;color:inherit;display:flex;flex-direction:column;gap:6px;min-height:118px}
.tile .num{font-size:13px;color:var(--soft);font-weight:600;letter-spacing:.4px}
.tile .t{font-weight:650;line-height:1.25}
.tile .sys{font-size:13px;color:var(--soft)}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:auto}
.bar>i{display:block;height:100%;background:var(--accent);width:0}
.due-banner{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 18px;box-shadow:var(--shadow)}
.due-banner b{font-size:22px}
.modes{display:grid;gap:10px;margin-top:8px}
.mode{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;font:inherit;color:inherit;text-align:left;box-shadow:var(--shadow)}
.mode .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:color-mix(in srgb,var(--accent) 14%,transparent);flex:none}
.mode .d{font-size:14px;color:var(--soft)}
.mode .score{margin-left:auto;font-size:14px;color:var(--soft);white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow)}
.big{font-size:30px;font-weight:700;line-height:1.15;word-break:break-word}
.say{color:var(--soft);font-size:16px;margin-top:4px}
.k-pre{color:var(--pre)} .k-root{color:var(--root)} .k-suf{color:var(--suf)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:14px;padding:13px 18px;font:inherit;font-weight:650;cursor:pointer;background:var(--ink);color:var(--paper)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ok{background:var(--ok);color:#fff} .btn.warn{background:var(--warn);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.ok,:root:not([data-theme="light"]) .btn.warn{color:#0b0d0f}}
:root[data-theme="dark"] .btn.ok,:root[data-theme="dark"] .btn.warn{color:#0b0d0f}
.progress a{color:var(--accent);text-decoration:none;font-weight:650;margin-right:8px}
.btn[disabled]{opacity:.45;cursor:default}
.speak{border:1px solid var(--line);background:var(--card);color:var(--accent);border-radius:999px;width:46px;height:46px;display:inline-grid;place-items:center;cursor:pointer;flex:none}
.speak svg{width:20px;height:20px}
.progress{font-size:14px;color:var(--soft);margin:0 0 10px}
.back-face{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px}
.label{font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--soft);font-weight:700;margin-top:10px}
textarea,input[type=text]{width:100%;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink)}
textarea{min-height:96px;resize:vertical}
.answer{background:color-mix(in srgb,var(--ok) 10%,transparent);border-left:4px solid var(--ok);padding:12px 14px;border-radius:10px;margin-top:12px}
.answer.miss{background:color-mix(in srgb,var(--warn) 10%,transparent);border-left-color:var(--warn)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;font:inherit;color:inherit;text-align:left;cursor:pointer;min-height:48px}
.chip.sel{outline:3px solid var(--accent)}
.chip.done{opacity:.4;cursor:default}
.chip.bad{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.note{font-size:14px;color:var(--soft)}
.chart-line{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.det-intro{font-size:18px;margin:0 0 12px}
details.hint{margin-top:10px;font-size:15px;color:var(--soft)}
details.hint summary{cursor:pointer;font-weight:650;color:var(--accent)}
details.hint div{margin-top:6px}
.free{display:inline-block;font-size:13px;font-weight:650;color:var(--soft);border:1px dashed var(--line);border-radius:999px;padding:2px 10px;margin-left:6px}
.end{text-align:center}
.end .big{font-size:42px}
footer{color:var(--soft);font-size:13px;margin-top:30px;text-align:center}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script src="data.js"></script>
<script>
/* Anatomy Set Practice v2.0 (10/5/2026), 2.1 fixes 10/19: alternates accepted, once-a-day grading, Detective in three parts. Content = the V2.0 book's own Must know lists, More practice A/B/C, Self-check,
   and Chart Detective, with the book's answers. Pronunciation = Brian's Personal Voice clips (audio/), never a robot voice.
   Progress lives only on this device (localStorage), shared with the Anatomy Set game on the same site. */
const B = window.BOOK || {chapters:[], clips:{}};
const KEY = 'anatomyset.practice.v2';
const LADDER = [0, 1, 4, 10, 21, 45];               // days; the first retrieval is always on a later day
const DAY = 864e5, today = () => Math.floor(Date.now() / DAY);
let S = {cards:{}, best:{}};
try { S = Object.assign(S, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => String(s || '').toLowerCase().replace(/[^a-z]/g, '');
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ---------- Brian's voice ---------- */
let player = null;
function clipFor(w) { const k = String(w || '').trim(); return B.clips[k] || B.clips[k.toLowerCase()] || null; }
function speakBtn(word) {
  const src = clipFor(word); if (!src) return '';
  return `<button class="speak" type="button" aria-label="Hear ${esc(word)} in Dr. Khan Quintana's voice" data-clip="${esc(src)}"><svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M3 7v6h4l5 4V3L7 7H3z"/><path d="M14.5 6.5a5 5 0 010 7" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>`;
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-clip]'); if (!b) return;
  try { if (player) player.pause(); player = new Audio(b.dataset.clip); player.play(); } catch (err) {}
});
function colorForm(f) {   // part coding from the book: prefix ends in a hyphen, suffix starts with one, else a root
  return String(f).split(/,\s*/).map(x => { const c = x.endsWith('-') ? 'k-pre' : x.startsWith('-') ? 'k-suf' : 'k-root'; return `<span class="${c}">${esc(x)}</span>`; }).join(', ');
}

/* ---------- cards (Must know) ---------- */
function deck(ch) {
  const out = [];
  ch.mustknow.parts.forEach(p => out.push({id: `c${ch.n}p:${p.form}`, kind:'part', front:p.form, say:p.say, meaning:p.meaning, extra:p.seen ? 'Seen in: ' + p.seen : '', voice:p.form.split(/,\s*/)[0]}));
  ch.mustknow.terms.forEach(t => out.push({id: `c${ch.n}t:${t.term}`, kind:'term', front:t.term + (t.abbr ? ` (${t.abbr})` : ''), say:t.say, meaning:t.meaning, extra:t.apart ? 'Take it apart: ' + t.apart : '', voice:t.term}));
  return out;
}
const allCards = () => B.chapters.flatMap(deck);
function dueCards() { const d = today(); return allCards().filter(c => S.cards[c.id] && S.cards[c.id].due <= d); }
function mastery(ch) { const cs = deck(ch); if (!cs.length) return 0; return cs.filter(c => (S.cards[c.id]?.box || 0) >= 3).length / cs.length; }
/* 2.1 (10/19): a card moves on the ladder at most once a day. Cramming the night before cannot fake
   "mastered" or push a card weeks out of review; any later pass that day is free practice. A card
   saved before 2.1 has no "last" field, so its last review day is read back from due - LADDER[box]. */
function lastReview(st) { return st ? (st.last != null ? st.last : (st.box ? st.due - LADDER[st.box] : -1)) : -1; }
const gradedToday = c => lastReview(S.cards[c.id]) >= today();
function grade(c, knew) {
  if (gradedToday(c)) return false;                 // already graded today: record nothing
  const st = S.cards[c.id] || {box:0, due:today()};
  st.box = knew ? Math.min(st.box + 1, LADDER.length - 1) : 1;
  st.due = today() + (knew ? LADDER[st.box] : 1);
  st.last = today();
  S.cards[c.id] = st; save(); return true;
}

/* ---------- screens ---------- */
function home() {
  const due = dueCards().length;
  app.innerHTML = `
  <header class="top"><h1 class="serif">Anatomy Set · Practice</h1><a class="icon-btn" href="./" aria-label="Open the Anatomy Set game">Game</a></header>
  <p class="lede">Every chapter of <i>Medical Terminology</i>, v2.0. Hear each word in Dr. Khan Quintana's voice, then prove you own it.</p>
  ${due ? `<div class="due-banner"><b>${due}</b><div style="flex:1">words are due for review today.<div class="note">Short and spaced is how they stick.</div></div><button class="btn" id="rev">Review</button></div>` : ''}
  <div class="grid">${B.chapters.map(ch => `
    <button class="tile" data-ch="${ch.n}"><span class="num">CHAPTER ${ch.n}</span><span class="t serif">${esc(ch.title)}</span><span class="sys">${esc(ch.system)}</span>
    <span class="bar" aria-label="${Math.round(mastery(ch)*100)} percent of the must-know words mastered"><i style="width:${Math.round(mastery(ch)*100)}%"></i></span></button>`).join('')}</div>
  <footer>Free, no account. Your progress stays on this device.<br>From <i>Medical Terminology</i> by Brian Khan Quintana, M.D.</footer>`;
  app.querySelectorAll('[data-ch]').forEach(b => b.onclick = () => chapter(+b.dataset.ch));
  const r = $('#rev'); if (r) r.onclick = () => flash(null, dueCards());
}
function chapter(n) {
  const ch = B.chapters.find(c => c.n === n), best = k => S.best[`${n}:${k}`];
  const sc = k => best(k) != null ? `best ${best(k)}` : '';
  app.innerHTML = `
  <header class="top"><button class="icon-btn" id="bk" aria-label="Back to all chapters">‹ All</button><h1 class="serif">Ch ${n} · ${esc(ch.title)}</h1></header>
  <p class="lede">${esc(ch.system)}. ${deck(ch).length} must-know words, ${Math.round(mastery(ch)*100)}% mastered.</p>
  <div class="modes">
    ${modeBtn('flash','🔊','Must know','Hear it, say it, check the meaning', sc('flash'))}
    ${modeBtn('match','🧩','Match them','Ten terms, ten meanings', sc('match'))}
    ${modeBtn('build','🔧','Build the word','Read the meaning, type the term', sc('build'))}
    ${modeBtn('chart','📋','Read the chart','Translate real-style chart lines', sc('chart'))}
    ${modeBtn('self','✍️','Self-check','Ten questions, the book\'s answers', sc('self'))}
    ${ch.detective && ch.detective.note ? modeBtn('det','🔎','Chart Detective','A whole note, in plain words', '') : ''}
  </div>`;
  $('#bk').onclick = home;
  app.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => ({flash:()=>flash(ch), match:()=>match(ch), build:()=>build(ch), chart:()=>write(ch,'chart'), self:()=>write(ch,'self'), det:()=>write(ch,'det')})[b.dataset.mode]());
}
const exitLink = ch => `<a href="#" onclick="event.preventDefault();${ch ? 'chapter(' + ch.n + ')' : 'home()'}">‹ ${ch ? 'Chapter' : 'All'}</a>`;
const modeBtn = (k, ic, t, d, s) => `<button class="mode" data-mode="${k}"><span class="ic" aria-hidden="true">${ic}</span><span><b>${t}</b><div class="d">${d}</div></span><span class="score">${esc(s)}</span></button>`;
function done(n, k, got, of, again, free) {
  if (n) { const key = `${n}:${k}`; S.best[key] = Math.max(S.best[key] || 0, got); save(); }
  const pct = of ? Math.round(100 * got / of) : 0;
  app.innerHTML = `<div class="card end"><div class="big">${got} / ${of}</div><p>${pct >= 85 ? 'That is mastery territory. Come back in a few days and prove it again.' : pct >= 60 ? 'Solid. The misses are exactly what to look at once more.' : 'Good start. Every miss you saw the answer for is a word you will know next time.'}</p>${free ? '<p class="note">Extra practice: your review schedule did not move. Each word counts once a day, so come back tomorrow.</p>' : ''}
  <div class="row" style="justify-content:center"><button class="btn" id="again">Again</button>${n ? '<button class="btn ghost" id="ch">Chapter</button>' : ''}<button class="btn ghost" id="hm">All chapters</button></div></div>`;
  $('#again').onclick = again; $('#hm').onclick = home; if (n) $('#ch').onclick = () => chapter(n);
}

/* ---------- 1. Must know (spaced flashcards in his voice) ---------- */
function flash(ch, list) {
  const pool = (list || shuffle(deck(ch).filter(c => !S.cards[c.id] || S.cards[c.id].due <= today()))).filter(c => !gradedToday(c));
  const extra = !pool.length;                       // nothing due: free practice that never grades
  const items = (extra ? shuffle(list || deck(ch)) : pool).slice(0, 15);
  let i = 0, got = 0;
  const show = () => {
    if (i >= items.length) return done(ch && ch.n, 'flash', got, items.length, () => flash(ch, list), extra);
    const c = items[i];
    app.innerHTML = `<p class="progress">${exitLink(ch)}${i + 1} of ${items.length}${ch ? ' · Chapter ' + ch.n : ' · Review'}${extra ? '<span class="free">Extra practice, does not move your schedule</span>' : ''}</p>
    <div class="card"><div class="row"><div style="flex:1"><div class="big">${c.kind === 'part' ? colorForm(c.front) : esc(c.front)}</div><div class="say">${esc(c.say)}</div></div>${speakBtn(c.voice)}</div>
    <p class="note">Say it out loud, then say what it means before you flip.</p>
    <div id="back" class="back-face" hidden><div class="label">Meaning</div><div class="serif" style="font-size:20px">${esc(c.meaning)}</div>${c.extra ? `<div class="note" style="margin-top:6px">${esc(c.extra)}</div>` : ''}</div>
    <div class="row" style="margin-top:16px" id="act"><button class="btn" id="flip">Show meaning</button></div></div>`;
    const sp = app.querySelector('[data-clip]'); if (sp) sp.click();
    $('#flip').onclick = () => { $('#back').hidden = false; $('#act').innerHTML = '<button class="btn ok" id="y">I knew it</button><button class="btn ghost" id="n">Not yet</button>';
      $('#y').onclick = () => { if (!extra) grade(c, true); got++; i++; show(); }; $('#n').onclick = () => { if (!extra) grade(c, false); i++; show(); }; };
  };
  show();
}

/* ---------- 2. Match ---------- */
function match(ch) {
  const pairs = ch.match.slice(0, 10), L = shuffle(pairs), R = shuffle(pairs);
  let sel = null, left = pairs.length, misses = 0;
  app.innerHTML = `<p class="progress">${exitLink(ch)}Chapter ${ch.n} · tap a term, then its meaning</p><div class="match" id="m">
    <div style="display:grid;gap:8px">${L.map(p => `<button class="chip" data-t="${esc(p.term)}">${esc(p.term)}</button>`).join('')}</div>
    <div style="display:grid;gap:8px">${R.map(p => `<button class="chip" data-m="${esc(p.term)}">${esc(p.meaning)}</button>`).join('')}</div></div>`;
  app.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { if (b.classList.contains('done')) return; app.querySelectorAll('[data-t]').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); sel = b; });
  app.querySelectorAll('[data-m]').forEach(b => b.onclick = () => {
    if (!sel || b.classList.contains('done')) return;
    if (b.dataset.m === sel.dataset.t) { b.classList.add('done'); sel.classList.add('done'); sel.classList.remove('sel'); const w = sel.dataset.t; sel = null; left--;
      const src = clipFor(w); if (src) { try { new Audio(src).play(); } catch (e) {} }
      if (!left) setTimeout(() => done(ch.n, 'match', pairs.length - Math.min(misses, pairs.length), pairs.length, () => match(ch)), 500); }
    else { misses++; b.classList.add('bad'); setTimeout(() => b.classList.remove('bad'), 400); }
  });
}

/* ---------- 3. Build the word (typed retrieval, elaborated feedback) ---------- */
// The book often lists more than one right answer ("dermatopathy or dermatosis", "also orchidectomy",
// "hypoglycemic agent"). data.js carries them as accept[]; this fallback splits the head the same way.
function acceptedForms(it) {
  if (it.accept && it.accept.length) return it.accept;
  const head = it.answer.split(/\s*\(|\.\s|\.$|:|;/)[0].trim();
  const forms = head.split(/\s*,?\s+or\s+|\s*,\s*/).filter(Boolean);
  forms.slice().forEach(f => { const m = f.match(/^(.*\S)\s+(?:agent|medication)$/); if (m) forms.push(m[1]); });
  return forms.length ? forms : [head];
}
function build(ch) {
  const items = shuffle(ch.build); let i = 0, got = 0;
  const show = () => {
    if (i >= items.length) return done(ch.n, 'build', got, items.length, () => build(ch));
    const it = items[i], forms = acceptedForms(it), want = forms[0];   // every form the book lists counts (2.1)
    app.innerHTML = `<p class="progress">${exitLink(ch)}${i + 1} of ${items.length} · Chapter ${ch.n}</p><div class="card">
      <div class="serif" style="font-size:21px">${esc(it.ask)}</div>
      <form id="f" class="row" style="margin-top:14px"><input type="text" id="a" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Type the term" placeholder="type the term"><button class="btn" type="submit">Check</button></form>
      <div id="fb"></div></div>`;
    $('#a').focus();
    $('#f').onsubmit = e => { e.preventDefault(); const typed = norm($('#a').value), hit = forms.find(f => norm(f) === typed), ok = !!typed && !!hit; if (ok) got++;
      const voice = [hit, ...forms].find(f => f && clipFor(f)) || want;
      $('#fb').innerHTML = `<div class="answer ${ok ? '' : 'miss'}"><b>${ok ? 'Yes.' : 'The word is:'}</b> ${esc(it.answer)} <span style="vertical-align:middle">${speakBtn(voice)}</span></div><div class="row" style="margin-top:12px"><button class="btn" id="nx">Next</button></div>`;
      const s = app.querySelector('#fb [data-clip]'); if (s) s.click();
      $('#nx').onclick = () => { i++; show(); }; $('#nx').focus(); };
  };
  show();
}

/* ---------- 4/5/6. Write it, then compare with the book (chart, self-check, detective) ---------- */
function write(ch, kind) {
  const d = ch.detective || {};
  const items = kind === 'chart' ? ch.chart.map(c => ({q:c.line, a:c.answer, chart:true}))
              : kind === 'self' ? ch.selfcheck.map(s => ({q:s.q, a:s.a}))
              : [{q:d.note, a:d.answer, chart:true, intro:d.intro, hint:d.glossary}];
  let i = 0, got = 0;
  const title = {chart:'Read the chart', self:'Self-check', det:'Chart Detective'}[kind];
  const show = () => {
    if (i >= items.length) return done(ch.n, kind, got, items.length, () => write(ch, kind));
    const it = items[i];
    const hint = it.hint ? it.hint.replace(/^Stuck on a word\?\s*/, '') : '';
    app.innerHTML = `<p class="progress">${exitLink(ch)}${title} · ${i + 1} of ${items.length} · Chapter ${ch.n}</p><div class="card">
      ${it.intro ? `<p class="serif det-intro">${esc(it.intro)}</p>` : ''}<div class="${it.chart ? 'chart-line' : 'serif'}" style="${it.chart ? '' : 'font-size:20px'}">${esc(it.q)}</div>
      ${hint ? `<details class="hint"><summary>Stuck on a word?</summary><div>${esc(hint)}</div></details>` : ''}
      <div class="label">${it.chart ? 'Your translation' : 'Your answer'}</div><textarea id="t" aria-label="Write your answer"></textarea>
      <div class="row" style="margin-top:12px" id="act"><button class="btn" id="rv">Show the book's answer</button></div><div id="fb"></div></div>`;
    $('#rv').onclick = () => {
      $('#fb').innerHTML = `<div class="answer">${esc(it.a)}</div><p class="note">Compare honestly. Close counts; the idea matters more than the exact words.</p>`;
      $('#act').innerHTML = '<button class="btn ok" id="h">I had it</button><button class="btn ghost" id="p">Partly</button><button class="btn ghost" id="m">Missed it</button>';
      $('#h').onclick = () => { got++; i++; show(); }; $('#p').onclick = () => { got += .5; i++; show(); }; $('#m').onclick = () => { i++; show(); };
    };
  };
  show();
}
home();
</script>
</body>
</html>
